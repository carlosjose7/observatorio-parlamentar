name: Pipeline

on:
  workflow_dispatch:
  pull_request:

jobs:
  secret-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  placeholder:
    name: Architecture scaffold
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI/CD will be implemented in Sprint 9."
