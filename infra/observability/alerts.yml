# Alertas Prometheus (Sprint 23, ADR-053, Onda 3; Sprint 24, ADR-054).
# Réguas espelham os SLOs de config/observability.yaml (0.95/24h/26h/2%/5%/
# 500ms) — sem Alertmanager: avaliados e visíveis no
# Prometheus UI/Grafana; roteamento fica para sprint futura.
# Exceção ADR-054: silver_cartao tem quarentena crônica ~17–20%
# (lacuna declarada da fonte, "Sem informação") — régua própria 20%/25%;
# o 2%/5% global vale para as demais tabelas (seletor !=).
groups:
  - name: observatorio.slos
    rules:
      - alert: FreshnessWarn
        expr: max(pipeline_watermark_lag_hours{fonte!="cgu_cartao"}) > 24
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "Watermark defasado além do SLO 24h (alerta em 26h, exceto cartão)"

      - alert: FreshnessCritical
        expr: max(pipeline_watermark_lag_hours{fonte!="cgu_cartao"}) > 26
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Watermark defasado além de 26h (exceto cartão)"

      # Cartão em backfill por desenho (desde 01/2013, +1 mês/dia):
      # lag absoluto é gigante e correto — o sinal que importa é o
      # PROGRESSO (lag diminuindo). Parado há 48h = warn (ADR-055).
      - alert: FreshnessCartaoStalled
        expr: deriv(pipeline_watermark_lag_hours{fonte="cgu_cartao"}[48h]) >= 0
        for: 1h
        labels:
          severity: warn
        annotations:
          summary: "Backfill do cartão sem progresso há 48h"

      - alert: PipelineFailed
        expr: pipeline_last_run_status{status="failed"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Última execução do pipeline falhou"

      - alert: PipelineStale
        expr: time() - pipeline_last_run_timestamp_seconds > 26 * 3600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Sem execução do pipeline há mais de 26h"

      - alert: QuarentenaWarn
        expr: sum(dq_quarentena{tabela!="silver_cartao"}) / sum(dq_total{tabela!="silver_cartao"}) > 0.02
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "Quarentena acima de 2% (SLO warn, exceto cartão)"

      - alert: QuarentenaCritical
        expr: sum(dq_quarentena{tabela!="silver_cartao"}) / sum(dq_total{tabela!="silver_cartao"}) > 0.05
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Quarentena acima de 5% (SLO critical, exceto cartão)"

      - alert: QuarentenaCartaoWarn
        expr: dq_quarentena{tabela="silver_cartao"} / dq_total{tabela="silver_cartao"} > 0.20
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "Quarentena do cartão acima de 20% (régua ADR-054)"

      - alert: QuarentenaCartaoCritical
        expr: dq_quarentena{tabela="silver_cartao"} / dq_total{tabela="silver_cartao"} > 0.25
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Quarentena do cartão acima de 25% (régua ADR-054)"

      - alert: ApiLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(http_latency_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "p95 da API acima de 500ms"

      - alert: GoldIndisponivel
        expr: increase(gold_indisponivel_total[15m]) > 0
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "Falhas de acesso ao Gold nos últimos 15m"
