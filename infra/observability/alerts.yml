# Alertas Prometheus (Sprint 23, ADR-053, Onda 3; Sprint 24, ADR-054).
# Réguas espelham os SLOs de config/observability.yaml (0.95/24h/26h/2%/5%/
# 500ms) — sem Alertmanager: avaliados e visíveis no
# Prometheus UI/Grafana; roteamento fica para sprint futura.
# Exceção ADR-054: silver_cartao tem quarentena crônica ~17–20%
# (lacuna declarada da fonte, "Sem informação") — régua própria 20%/25%;
# o 2%/5% global vale para as demais tabelas (seletor !=).
groups:
  - name: observatorio.slos
    rules:
      # Réguas absolutas 24h/26h aposentadas (ADR-061): nenhuma fonte
      # tem watermark com granularidade de horas — ver regras granulares.
      # Nota PromQL: `time()` é escalar e `year()/month()` exigem vetor;
      # o lado "agora" vai escalarizado (`scalar(...vector(time()))`)
      # para o broadcast funcionar — validado contra o Prometheus real.
      - alert: FreshnessAnualStale
        expr: year(time() - pipeline_watermark_lag_hours{fonte=~"senado|cgu_emenda"} * 3600) < scalar(year(vector(time()))) and on() (month(vector(time())) >= 3)
        for: 24h
        labels:
          severity: warn
        annotations:
          summary: "Watermark anual defasado (ano < corrente, após graça Jan/Fev)"

      - alert: FreshnessAnualCritical
        expr: scalar(year(vector(time()))) - year(time() - pipeline_watermark_lag_hours{fonte=~"senado|cgu_emenda"} * 3600) >= 2 and on() (month(vector(time())) >= 3)
        for: 24h
        labels:
          severity: critical
        annotations:
          summary: "Watermark anual 2+ anos defasado"

      - alert: FreshnessCamaraWarn
        expr: scalar(year(vector(time())) * 12 + month(vector(time()))) - (year(time() - pipeline_watermark_lag_hours{fonte="camara"} * 3600) * 12 + month(time() - pipeline_watermark_lag_hours{fonte="camara"} * 3600)) >= 2
        for: 1h
        labels:
          severity: warn
        annotations:
          summary: "Câmara 2+ meses defasada (1 mês de graça)"

      - alert: FreshnessCamaraCritical
        expr: scalar(year(vector(time())) * 12 + month(vector(time()))) - (year(time() - pipeline_watermark_lag_hours{fonte="camara"} * 3600) * 12 + month(time() - pipeline_watermark_lag_hours{fonte="camara"} * 3600)) >= 3
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Câmara 3+ meses defasada"

      # Cartão em backfill por desenho (desde 01/2013, +1 mês/dia):
      # lag absoluto é gigante e correto — o sinal que importa é o
      # PROGRESSO (lag diminuindo). Parado há 48h = warn (ADR-055).
      - alert: FreshnessCartaoStalled
        expr: deriv(pipeline_watermark_lag_hours{fonte="cgu_cartao"}[48h]) >= 0
        for: 1h
        labels:
          severity: warn
        annotations:
          summary: "Backfill do cartão sem progresso há 48h"

      - alert: PipelineFailed
        expr: pipeline_last_run_status{status="failed"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Última execução do pipeline falhou"

      - alert: PipelineStale
        expr: time() - pipeline_last_run_timestamp_seconds > 26 * 3600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Sem execução do pipeline há mais de 26h"

      - alert: QuarentenaWarn
        expr: sum(dq_quarentena{tabela!="silver_cartao"}) / sum(dq_total{tabela!="silver_cartao"}) > 0.02
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "Quarentena acima de 2% (SLO warn, exceto cartão)"

      - alert: QuarentenaCritical
        expr: sum(dq_quarentena{tabela!="silver_cartao"}) / sum(dq_total{tabela!="silver_cartao"}) > 0.05
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Quarentena acima de 5% (SLO critical, exceto cartão)"

      - alert: QuarentenaCartaoWarn
        expr: dq_quarentena{tabela="silver_cartao"} / dq_total{tabela="silver_cartao"} > 0.20
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "Quarentena do cartão acima de 20% (régua ADR-054)"

      - alert: QuarentenaCartaoCritical
        expr: dq_quarentena{tabela="silver_cartao"} / dq_total{tabela="silver_cartao"} > 0.25
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Quarentena do cartão acima de 25% (régua ADR-054)"

      - alert: ApiLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(http_latency_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "p95 da API acima de 500ms"

      - alert: GoldIndisponivel
        expr: increase(gold_indisponivel_total[15m]) > 0
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "Falhas de acesso ao Gold nos últimos 15m"

      # ── Sprint 26 (ADR-056, Onda 6) ──────────────────────────
      # Roteadas pelo Alertmanager (roteador desta sprint); destino default
      # `blackhole` até o PO confirmar o webhook Slack (ver alertmanager.yml).
      - alert: PipelineHealthCritical
        expr: pipeline_health_index < 50
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Health Index abaixo de 50 (Crítico, ADR-056 D4)"

      - alert: DQScoreFail
        expr: pipeline_dq_score_fail_total > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Tabela(s) com DQ FAIL no snapshot mais recente (ADR-056 D7)"

      - alert: TaskFalhou
        expr: pipeline_task_last_run_status{status="success"} == 0
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "Último span da task não é success (ver heatmap task×dia)"
