# Prometheus — scrape da Fase 1 (Sprint 22, ADR-051, Onda 4).
# Consumido pelo serviço `prometheus` do docker-compose.yml (imagem
# prom/prometheus, UI em 127.0.0.1:9090 — nunca via Nginx).
# Escopo Fase 0+1: api, pipeline-exporter, node, cadvisor (+postgres,
# perfil pipeline). FORA desta sprint, como pendências (ver BACKLOG):
# minio /minio/v2/metrics/cluster (exigiria credencial admin em arquivo
# estático versionado — sem mecanismo de injeção de segredo, ADR-008) e
# statsd-exporter / AIRFLOW__METRICS__STATSD_ON.
global:
  # Intervalo de scrape do contrato (ADR-051 §7).
  scrape_interval: 15s
  evaluation_interval: 15s

# Regras de alerta (Sprint 23, ADR-053, Onda 3) — sem Alertmanager;
# avaliadas e visíveis no Prometheus UI/Grafana.
rule_files:
  - alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  - job_name: pipeline-exporter
    static_configs:
      - targets: ["pipeline-exporter:8001"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # postgres-exporter só existe com o perfil `pipeline` (mesmo perfil do
  # postgres que ele monitora): fora do perfil o target fica down, o que
  # é o estado esperado — não é incidente.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
