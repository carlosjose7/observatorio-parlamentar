# Alertmanager — roteamento das regras (Sprint 26, Onda 6, ADR-056 D6;
# Telegram, ADR-057). Cobre as 14 regras de `alerts.yml` (11 das
# Sprints 23–25 + 3 da Sprint 26): `critical` → Telegram, demais →
# `blackhole` (visíveis só no Prometheus UI/Grafana — pager discipline:
# `warn` no celular vira fadiga; promover `warn` depois é um adendo).
#
# Receiver `slack` ao final = ESTRUTURA PRONTA, desativada (comentada):
# soma como segundo destino quando o PO confirmar o webhook via `.env`
# (`SLACK_WEBHOOK_URL`, ver `.env.example`) — NUNCA hardcode nem valor
# real versionado (decisão: soma, não substitui — ADR-057).
global:
  resolve_timeout: 5m

route:
  receiver: blackhole
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: telegram

receivers:
  - name: blackhole
  - name: telegram
    telegram_configs:
      - # Token FORA do repo (ADR-008): arquivo local gitignored
        # `secrets/telegram_bot_token` (chmod 600), montado em
        # `/run/secrets/` via compose. Sem o arquivo, o boot segue
        # normal e a falha de envio aparece no log (gap auto-evidente).
        bot_token_file: '/run/secrets/telegram_bot_token'
        # chat_id NÃO é segredo (id numérico do grupo/canal) — versionado.
        # Grupo "Alertas Observatório" (supergroup). `0` é rejeitado no
        # load ("missing chat_id") — achado empírico documentado no ADR-057.
        chat_id: -1004395225912
        send_resolved: true

