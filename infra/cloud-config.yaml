#cloud-config
# Cloud-config do Observatório Parlamentar para Oracle Linux 9.8 (OCI).
# Usuário administrativo da imagem: opc (diferente do Ubuntu, que usa `ubuntu`).
package_update: true
packages:
  - firewalld
runcmd:
  # ── Docker (via script oficial, suporta Oracle Linux) ────────────────
  - [sh, -c, 'curl -fsSL https://get.docker.com -o /tmp/get-docker.sh && sh /tmp/get-docker.sh']
  - systemctl enable --now docker
  # Habilita o usuário opc a usar o Docker sem sudo (o .service do pipeline
  # roda com Group=docker — sem isso, permission denied no socket).
  - usermod -aG docker opc
  # ── Firewall (firewalld — nativo do Oracle Linux) ─────────────────────
  - systemctl enable --now firewalld
  # NOTA: o serviço ssh do firewalld NÃO é removido aqui. A restrição de
  # acesso SSH fica na Security List OCI (IPs de administração). A restrição
  # extra no firewalld é aplicada manualmente via SSH após a validação do
  # deploy — evita auto-lockout se uma regra rica falhar no primeiro boot.
  # HTTP/HTTPS públicos (Gate 5 — TLS via Let's Encrypt).
  - firewall-cmd --permanent --add-service=http
  - firewall-cmd --permanent --add-service=https
  - firewall-cmd --reload
  # ── Hardening SSH ────────────────────────────────────────────────────
  - sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
  - sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
  - systemctl restart sshd