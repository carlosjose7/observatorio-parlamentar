version: 2

sources:
  - name: silver
    description: >
      Camada Silver (DuckDB), populada por pipeline/silver.py via os transform.py
      (ADR-023). Vive no MESMO arquivo DuckDB da Gold (DUCKDB_DATABASE_PATH,
      ADR-001/ADR-008). As tabelas são criadas pelo transform do Silver no
      schema `main` do arquivo — o `schema:` da source é mapeado para cá (sem
      isso o dbt buscaria em `silver.silver_*`).
    schema: main
    tables:
      - name: silver_despesa
        description: Despesas normalizadas Câmara + Senado (coluna `fonte`; ADR-016/ADR-023).
      - name: silver_emenda
        description: Emendas parlamentares CGU normalizadas (ADR-017).
      - name: silver_parlamentar
        description: >
          Registros as-of de parlamentares Câmara+Senado (fonte `fonte`),
          snapshot por data — insumo bruto da dimensão SCD Type 2
          `dim_parlamentar` (ADR-020).
      - name: silver_cartao
        description: Transações CPGF CGU normalizados (chave `id`, transform.py).
      - name: data_quality_report
        description: Data Quality Report da Silver (ADR-015), por run_id/tabela.