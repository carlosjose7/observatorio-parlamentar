version: 2

# Contrato de qualidade do fato (ADR-022).
#
# DUAS camadas de integridade referencial convivem, por DESIGN — não remover uma
# como "redundante":
#
#   1. `relationships` (genérico, `severity: warn`): binário — qualquer órfão
#      (ex: PK duplicada na dimensão, ref trocada) é sintoma de erro estrutural
#      de modelagem. Dispara com UM órfão.
#   2. `fk_orphan_pct` (genérico custom, `severity: warn`): métrica de saúde
#      operacional consumida pelo Data Quality Report (ADR-022.3a) — computa a
#      razão órfãos/total do fato e SÓ dispara quando ela ultrapassa o threshold
#      `fk_orfas_threshold_pct`, cuja FONTE ÚNICA é `config/pipeline.yaml`
#      (`data_quality.fk_orfa_threshold_pct`, via `get_dbt_vars()` — ADR-008;
#      o projeto dbt não declara o número).
#      Falha estrutural grosseira é pega pelo `relationships`; órfão transitório
#      (ex: fornecedor novo no fato antes da próxima carga da dimensão) é alerta
#      observável sem bloquear o build.

models:
  - name: fact_emenda
    description: >
      Fato de emendas parlamentares de autor individual resolvido (ADR-012/017).
      Grão: uma emenda. Apenas autoria sem ambiguidade é promovida; o restante
      fica em fact_emenda_quarantine (inclui orgao_nao_resolvido, ADR-022.1).
    columns:
      - name: id_emenda
        description: Surrogate determinístico do fato (row_number sobre a resolução ordenada). Não é identificador externo durável (nota ADR-020).
        tests:
          - unique
          - not_null
      - name: ano
        tests:
          - not_null
      - name: codigo_emenda
        tests:
          - not_null
      - name: id_parlamentar
        description: Chave natural da versão vigente no ano (ADR-017). NOT NULL — identidade do evento.
        tests:
          - not_null
          - relationships:
              to: ref('dim_parlamentar')
              field: id_parlamentar
              config:
                severity: warn
          - fk_orphan_pct:
              to: ref('dim_parlamentar')
              field: id_parlamentar
              config:
                severity: warn
      - name: surrogate_key
        description: Versão exata de dim_parlamentar usada no matching (auditoria ADR-017).
        tests:
          - not_null
          - relationships:
              to: ref('dim_parlamentar')
              field: surrogate_key
              config:
                severity: warn
          - fk_orphan_pct:
              to: ref('dim_parlamentar')
              field: surrogate_key
              config:
                severity: warn
      - name: id_orgao
        description: dim_orgao do autor (CD=1/SF=2), derivada via JOIN por sigla da fonte da versão casada (sem literal hardcoded).
        tests:
          - not_null
          - relationships:
              to: ref('dim_orgao')
              field: id_orgao
              config:
                severity: warn
          - fk_orphan_pct:
              to: ref('dim_orgao')
              field: id_orgao
              config:
                severity: warn
      - name: data_sk
        description: dim_data — representa a emenda em 31/12/ano (fonte só expõe ano).
        tests:
          - not_null
          - relationships:
              to: ref('dim_data')
              field: data_sk
              config:
                severity: warn
          - fk_orphan_pct:
              to: ref('dim_data')
              field: data_sk
              config:
                severity: warn
      - name: tipo_emenda
        tests:
          - not_null

  - name: fact_emenda_quarantine
    description: Emendas de autoria não resolvida, não promovidas (ADR-017/018) — inclui motivo orgao_nao_resolvido (FK de órgão não casou).
    columns:
      - name: motivo_quarentena
        tests:
          - not_null
          - accepted_values:
              values:
                - 'autor_colegiado'
                - 'autor_ambiguo'
                - 'autor_fora_cobertura'
                - 'autor_nao_resolvido'
                - 'orgao_nao_resolvido'
