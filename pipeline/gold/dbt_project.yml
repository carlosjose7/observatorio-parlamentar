name: 'observatorio_gold'
version: '1.0.0'
config-version: 2

profile: 'observatorio_gold'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Configuração externalizada (ADR-008 — sem constantes fixas no código).
# Horizonte do calendário: data_inicio espelha o início real da Câmara
# (config/sources.yaml: camara.carga_historica.data_inicio) e data_fim a
# projeção de ~20 anos exigida pelo RNF de escalabilidade (§1.3).
vars:
  dim_data_inicio: "2015-01-01"
  dim_data_fim: "2035-12-31"
  # Diretório do Parquet de controle da Bronze (ADR-019). Padrão relativo ao
  # arquivo DuckDB (resolve para reporoot/data/bronze/...). Em produção com
  # MinIO, overridar para o local remoto.
  bronze_pipeline_runs_dir: "../../data/bronze/controle/pipeline_runs/*.parquet"
  # Discriminador primário de autoria colegiada (ADR-017.3.a). Valores reais
  # do enum da fonte a confirmar no catálogo — item de seguimento no BACKLOG.
  # Padrão é o observado na captura real: "Emenda de Bancada" / "Emenda de Comissão"
  # (normalizados em uppercase sem acento).
  emenda_tipos_colegiados: ["EMENDA DE BANCADA", "EMENDA DE COMISSAO"]

models:
  observatorio_gold:
    dimensions:
      +materialized: table
    facts:
      +materialized: table
    analytics:
      +materialized: table
    control:
      +materialized: incremental
    emenda:
      +materialized: table
    despesa:
      +materialized: table

seeds:
  observatorio_gold:
    dim_orgao:
      +column_types:
        id_orgao: bigint
        poder: varchar
        instituicao: varchar
        sigla: varchar
        ug_siafi: varchar
        gestao: varchar
