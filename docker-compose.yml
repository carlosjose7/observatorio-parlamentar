services:
  # ── Reverse Proxy ───────────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      minio:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    networks:
      - observatorio-net
    restart: unless-stopped

  # ── Certbot (emissão inicial manual + renovação automática) ──
  certbot:
    image: certbot/certbot:latest
    security_opt:
      - no-new-privileges:true
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

  # ── Object Storage ──────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    env_file: ${MINIO_ENV_FILE:-.env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    security_opt:
      - no-new-privileges:true
    networks:
      - observatorio-net
    restart: unless-stopped

  # ── API ─────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: production
    # Env mínimo (.env.api): a API só lê o DuckDB Gold (ADR-026). Credenciais
    # MinIO chegam via `environment` abaixo, interpoladas do .env do projeto.
    env_file: ${API_ENV_FILE:-.env.api}
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-observatorio_admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - VISITAS_DB_PATH=/app/var/visitas/visitas.duckdb
     # :ro — fronteira de leitura (ADR-026) também no mount: a API nunca
     # escreve no Gold, nem sob comprometimento do container.
    volumes:
      - ./data:/app/data:ro
      # DuckDB do contador de visitas (Sprint 12): volume dedicado FORA do
      # mount :ro acima — aninhar volume sob mount ro quebra o create.
      - visitas-data:/app/var/visitas
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    depends_on:
      minio:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    networks:
      - observatorio-net
    restart: unless-stopped

  # ── Dashboard ───────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    # Env mínimo (.env.dashboard): o dashboard só precisa apontar para a API —
    # nunca recebe segredos de MinIO/CGU/HMAC (superprivilégio eliminado).
    env_file: ${DASHBOARD_ENV_FILE:-.env.dashboard}
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - observatorio-net
    restart: unless-stopped

  # ── Observabilidade — métricas (Sprint 22, ADR-051, Fase 0+1) ──
  # Scrape interno via rede observatorio-net; nada aqui é publicado pelo
  # Nginx. Única porta no host: 9090 do Prometheus, presa a 127.0.0.1
  # (mesmo padrão do minio/airflow). Grafana/alertas ficam p/ sprint futura.
  pipeline-exporter:
    build:
      context: .
      dockerfile: observability/Dockerfile
    # Mesmo env mínimo da API (.env.api): só precisa do caminho do Gold
    # read-only (ADR-026); sem segredos de MinIO/CGU/HMAC.
    env_file: ${API_ENV_FILE:-.env.api}
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/metrics')"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - observatorio-net
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    platform: linux/arm64
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    security_opt:
      - no-new-privileges:true
    networks:
      - observatorio-net
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    platform: linux/arm64
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - observatorio-net
    restart: unless-stopped

  prometheus:
    # Stateless os sidecars (:latest, sem volume — mesmo precedente do
    # certbot); o Prometheus tem volume TSDB, por isso pin de major (v3).
    image: prom/prometheus:v3
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    security_opt:
      - no-new-privileges:true
    networks:
      - observatorio-net
    restart: unless-stopped

  alertmanager:
    # Sprint 26, Onda 6 (ADR-056 D6): roteador das 14 regras de alerts.yml.
    # Pin de minor com estado (mesmo precedente do grafana:13.2); UI em
    # 127.0.0.1:9093, sem Nginx. Destino default `blackhole`
    # (infra/observability/alertmanager.yml) — Slack só via .env quando o
    # PO confirmar o webhook (ver .env.example: SLACK_WEBHOOK_URL).
    image: prom/alertmanager:v0.28.0
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--cluster.listen-address="
    volumes:
      - ./infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets/telegram_bot_token:/run/secrets/telegram_bot_token:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    security_opt:
      - no-new-privileges:true
    networks:
      - observatorio-net
    restart: unless-stopped

  grafana:
    # Fase 2 (Sprint 23, ADR-053): pin de minor (tem estado sqlite, mesmo
    # precedente do prom/prometheus:v3); sidecars stateless seguem :latest.
    # (`:11`/`:13` puros não existem no Hub — minor recebe só patches.)
    image: grafana/grafana:13.2
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?Defina GF_SECURITY_ADMIN_PASSWORD no .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true
    networks:
      - observatorio-net
    restart: unless-stopped
  # ── Pipeline (Airflow) ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-airflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      - POSTGRES_DB=${POSTGRES_DB:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-airflow}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - observatorio-net
    restart: unless-stopped
    profiles:
      - pipeline

  # Incluído (não pendente): ~50MB RAM, segredo via environment do .env
  # (nada em arquivo versionado) e mesmo perfil do postgres que monitora.
  # Avaliação de RAM da Onda 4: 6,6GB livres em 10,9GB totais com as duas
  # stacks no ar — folga ampla. Deferidos desta sprint: job do minio
  # (exigiria credencial admin em prometheus.yml estático — ADR-008) e
  # statsd-exporter / AIRFLOW__METRICS__STATSD_ON (pendência futura).
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-airflow}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - observatorio-net
    restart: unless-stopped
    profiles:
      - pipeline

  airflow-webserver:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    # Entrypoint OFICIAL da imagem apache/airflow: com _AIRFLOW_DB_MIGRATE e
    # _AIRFLOW_WWW_USER_CREATE ele aplica migrações e cria o admin lendo a
    # senha de VARIÁVEL DE AMBIENTE (nunca de argv — antes aparecia em ps aux).
    # Criação é idempotente: usuário existente não é sobrescrito.
    command: webserver
    env_file: ${PIPELINE_ENV_FILE:-.env}
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-airflow}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:?Defina AIRFLOW_FERNET_KEY no .env}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      # DAGs em ./pipeline/dags; o pacote `pipeline` fica em /opt/airflow/pipeline
      # (nunca montar ./pipeline em /opt/airflow/dags — sobrescreve o pacote
      # instalado pelo pip e quebra `import pipeline`).
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/pipeline/dags
      - PYTHONPATH=/opt/airflow
      - AIRFLOW__WEBSERVER__RBAC=True
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_ADMIN_USER:-admin}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_ADMIN_PASSWORD:?Defina AIRFLOW_ADMIN_PASSWORD no .env}
      - _AIRFLOW_WWW_USER_EMAIL=${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-observatorio_admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./pipeline:/opt/airflow/pipeline
      - ./config:/opt/airflow/config
      - ./data:/opt/airflow/data
      # Task logs fora do container efêmero (diagnóstico 09/2026: o
      # gold_core morreu sem deixar traceback — scheduler do perfil
      # pipeline é removido ao final de cada run). Só tem efeito no
      # próximo `up`; nada é reiniciado por este diff.
      - ./logs/airflow:/opt/airflow/logs
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - observatorio-net
    restart: unless-stopped
    profiles:
      - pipeline

  airflow-scheduler:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    entrypoint: >
      bash -c "
      airflow db upgrade &&
      airflow scheduler
      "
    env_file: ${PIPELINE_ENV_FILE:-.env}
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-airflow}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:?Defina AIRFLOW_FERNET_KEY no .env}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      - AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL=300
      # DAGs em ./pipeline/dags; o pacote `pipeline` fica em /opt/airflow/pipeline
      # (nunca montar ./pipeline em /opt/airflow/dags — sobrescreve o pacote
      # instalado pelo pip e quebra `import pipeline`).
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/pipeline/dags
      - PYTHONPATH=/opt/airflow
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-observatorio_admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./pipeline:/opt/airflow/pipeline
      - ./analytics:/opt/airflow/analytics
      - ./config:/opt/airflow/config
      - ./data:/opt/airflow/data
      # Idem webserver: o scheduler (único executor de tasks no perfil
      # pipeline) escreve aqui; o webserver só lê para exibir na UI.
      - ./logs/airflow:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - observatorio-net
    restart: unless-stopped
    profiles:
      - pipeline

networks:
  observatorio-net:
    driver: bridge

volumes:
  minio_data:
  postgres_data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  certbot-etc:
  certbot-var:
  certbot-www:
  visitas-data:
