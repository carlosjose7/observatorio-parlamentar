services:
  # ── Reverse Proxy ───────────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      minio:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    networks:
      - observatorio-net
    restart: unless-stopped

  # ── Certbot (emissão inicial manual + renovação automática) ──
  certbot:
    image: certbot/certbot:latest
    security_opt:
      - no-new-privileges:true
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

  # ── Object Storage ──────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    env_file: ${MINIO_ENV_FILE:-.env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    security_opt:
      - no-new-privileges:true
    networks:
      - observatorio-net
    restart: unless-stopped

  # ── API ─────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    # Env mínimo (.env.api): a API só lê o DuckDB Gold (ADR-026). Credenciais
    # MinIO chegam via `environment` abaixo, interpoladas do .env do projeto.
    env_file: ${API_ENV_FILE:-.env.api}
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-observatorio_admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
     # :ro — fronteira de leitura (ADR-026) também no mount: a API nunca
     # escreve no Gold, nem sob comprometimento do container.
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    depends_on:
      minio:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    networks:
      - observatorio-net
    restart: unless-stopped

  # ── Dashboard ───────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    # Env mínimo (.env.dashboard): o dashboard só precisa apontar para a API —
    # nunca recebe segredos de MinIO/CGU/HMAC (superprivilégio eliminado).
    env_file: ${DASHBOARD_ENV_FILE:-.env.dashboard}
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - observatorio-net
    restart: unless-stopped

  # ── Pipeline (Airflow) ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-airflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      - POSTGRES_DB=${POSTGRES_DB:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-airflow}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - observatorio-net
    restart: unless-stopped
    profiles:
      - pipeline

  airflow-webserver:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    # Entrypoint OFICIAL da imagem apache/airflow: com _AIRFLOW_DB_MIGRATE e
    # _AIRFLOW_WWW_USER_CREATE ele aplica migrações e cria o admin lendo a
    # senha de VARIÁVEL DE AMBIENTE (nunca de argv — antes aparecia em ps aux).
    # Criação é idempotente: usuário existente não é sobrescrito.
    command: webserver
    env_file: ${PIPELINE_ENV_FILE:-.env}
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-airflow}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:?Defina AIRFLOW_FERNET_KEY no .env}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      # DAGs em ./pipeline/dags; o pacote `pipeline` fica em /opt/airflow/pipeline
      # (nunca montar ./pipeline em /opt/airflow/dags — sobrescreve o pacote
      # instalado pelo pip e quebra `import pipeline`).
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/pipeline/dags
      - PYTHONPATH=/opt/airflow
      - AIRFLOW__WEBSERVER__RBAC=True
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_ADMIN_USER:-admin}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_ADMIN_PASSWORD:?Defina AIRFLOW_ADMIN_PASSWORD no .env}
      - _AIRFLOW_WWW_USER_EMAIL=${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-observatorio_admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./pipeline:/opt/airflow/pipeline
      - ./config:/opt/airflow/config
      - ./data:/opt/airflow/data
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - observatorio-net
    restart: unless-stopped
    profiles:
      - pipeline

  airflow-scheduler:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    entrypoint: >
      bash -c "
      airflow db upgrade &&
      airflow scheduler
      "
    env_file: ${PIPELINE_ENV_FILE:-.env}
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-airflow}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:?Defina AIRFLOW_FERNET_KEY no .env}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      - AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL=300
      # DAGs em ./pipeline/dags; o pacote `pipeline` fica em /opt/airflow/pipeline
      # (nunca montar ./pipeline em /opt/airflow/dags — sobrescreve o pacote
      # instalado pelo pip e quebra `import pipeline`).
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/pipeline/dags
      - PYTHONPATH=/opt/airflow
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-observatorio_admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./pipeline:/opt/airflow/pipeline
      - ./analytics:/opt/airflow/analytics
      - ./config:/opt/airflow/config
      - ./data:/opt/airflow/data
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - observatorio-net
    restart: unless-stopped
    profiles:
      - pipeline

networks:
  observatorio-net:
    driver: bridge

volumes:
  minio_data:
  postgres_data:
  certbot-etc:
  certbot-var:
  certbot-www:
