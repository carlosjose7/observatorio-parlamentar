# ── Rate limit por IP ────────────────────────────────────────
limit_req_zone  $binary_remote_addr  zone=per_ip:10m   rate=10r/s;
limit_conn_zone $binary_remote_addr  zone=conn_per_ip:10m;

# 429 Too Many Requests em vez do 503 default (semântica correta de throttle)
limit_req_status 429;
limit_conn_status 429;

# ── Upstreams via DNS dinâmico (hotfix pós-#79, 15/09/2026) ──
# Mesmo motivo do default.conf: `upstream` estático congela o IP no
# start; com variável + resolver o Nginx re-resolve a cada TTL (10s).
resolver 127.0.0.11 valid=10s ipv6=off;

# ── Bootstrap (fase 1): só porta 80 para o desafio ACME ──────
# Usado até a emissão inicial do certificado. Depois de emitido,
# o deploy troca para default.conf (com o bloco 443) e recarrega.
server {
    listen 80;
    server_name observatorio-parlamentar.com.br www.observatorio-parlamentar.com.br;

    # Headers básicos (HSTS só no bloco HTTPS — default.conf)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API
    location /api/ {
        limit_req  zone=per_ip burst=20 nodelay;
        limit_conn conn_per_ip 20;
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        limit_req  zone=per_ip burst=20 nodelay;
        limit_conn conn_per_ip 20;
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        limit_req  zone=per_ip burst=20 nodelay;
        limit_conn conn_per_ip 20;
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Landing page (estática) — vitrine institucional
    location / {
        root /var/www/site;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location = /app {
        return 301 /app/;
    }

    # Dashboard (Streamlit) sob subcaminho — baseUrlPath=/app no container
    location /app/ {
        limit_req  zone=per_ip burst=20 nodelay;
        limit_conn conn_per_ip 10;
        set $upstream_dashboard dashboard:8501;
        proxy_pass http://$upstream_dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60;
    }
}

# Console administrativa do MinIO NÃO é exposta nem na fase de bootstrap:
# o acesso permanece restrito ao bind local (127.0.0.1:9001/19001).