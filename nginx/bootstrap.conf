# ── Rate limit por IP ────────────────────────────────────────
limit_req_zone  $binary_remote_addr  zone=per_ip:10m   rate=10r/s;
limit_conn_zone $binary_remote_addr  zone=conn_per_ip:10m;

upstream api {
    server api:8000;
}

upstream dashboard {
    server dashboard:8501;
}

# ── Bootstrap (fase 1): só porta 80 para o desafio ACME ──────
# Usado até a emissão inicial do certificado. Depois de emitido,
# o deploy troca para default.conf (com o bloco 443) e recarrega.
server {
    listen 80;
    server_name observatorio-parlamentar.com.br www.observatorio-parlamentar.com.br;

    # Headers básicos (HSTS só no bloco HTTPS — default.conf)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API
    location /api/ {
        limit_req  zone=per_ip burst=20 nodelay;
        limit_conn conn_per_ip 20;
        proxy_pass http://api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        limit_req  zone=per_ip burst=20 nodelay;
        limit_conn conn_per_ip 20;
        proxy_pass http://api/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        limit_req  zone=per_ip burst=20 nodelay;
        limit_conn conn_per_ip 20;
        proxy_pass http://api/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Dashboard (Streamlit)
    location / {
        limit_req  zone=per_ip burst=20 nodelay;
        limit_conn conn_per_ip 10;
        proxy_pass http://dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60;
    }
}

# Console administrativa do MinIO NÃO é exposta nem na fase de bootstrap:
# o acesso permanece restrito ao bind local (127.0.0.1:9001/19001).