# ── Rate limit por IP (defesa contra brute force / DoS de aplicação) ──
limit_req_zone  $binary_remote_addr  zone=per_ip:10m   rate=10r/s;
limit_conn_zone $binary_remote_addr  zone=conn_per_ip:10m;

upstream api {
    server api:8000;
}

upstream dashboard {
    server dashboard:8501;
}

# ── HTTP: desafio ACME + redirect para HTTPS ─────────────────
server {
    listen 80;
    server_name observatorio-parlamentar.com.br www.observatorio-parlamentar.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name observatorio-parlamentar.com.br www.observatorio-parlamentar.com.br;

    ssl_certificate     /etc/letsencrypt/live/observatorio-parlamentar.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/observatorio-parlamentar.com.br/privkey.pem;

    # ── Headers de segurança (sempre = também em 4xx/5xx) ────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # API
    location /api/ {
        limit_req  zone=per_ip burst=20 nodelay;
        limit_conn conn_per_ip 20;
        proxy_pass http://api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /docs {
        limit_req  zone=per_ip burst=20 nodelay;
        limit_conn conn_per_ip 20;
        proxy_pass http://api/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /openapi.json {
        limit_req  zone=per_ip burst=20 nodelay;
        limit_conn conn_per_ip 20;
        proxy_pass http://api/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Dashboard (Streamlit)
    location / {
        limit_req  zone=per_ip burst=20 nodelay;
        limit_conn conn_per_ip 10;
        proxy_pass http://dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket support for Streamlit
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60;
    }
}

# Console administrativa do MinIO (minio:9001) NÃO é exposta pelo proxy:
# fica restrita à rede interna e ao host via bind 127.0.0.1:9001
# (docker-compose.yml). Acesso operacional por SSH tunnel apenas.