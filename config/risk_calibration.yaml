# Calibração do risk_index (ADR-062, Sprint 29).
# Valores marcados "a calibrar" são baselines da fase Cientista de Dados.

risk_calibration:
  # Janela de referência: anos civis fechados da legislatura atual (pool + por ano).
  window_years: [2023, 2024, 2025]

  days_per_month: 30.4375        # divisor de meses em exercício (ADR-062, item 4)
  n_min_pares: 10                # a calibrar — mínimo de pares no grupo (casa, UF)
  n_min_sensitivity: [5, 8, 10]  # n_min testados na análise de sensibilidade
  meses_min: 3                   # a calibrar — abaixo disso V = 0 (janela curta)
  w_min_aviso: 0.05              # a calibrar — peso CRITIC abaixo disso gera aviso
  min_pair_value: 0.0            # pares fornecedor-parlamentar com valor líquido <= isto saem do HHI
  top_fraction: 0.10             # fração do top usada no Jaccard
  dispersion_quantiles: [[0.90, 0.10], [0.99, 0.01]]   # [alto, baixo]

  tables:
    fact_despesa: gold.fact_despesa
    dim_parlamentar: gold.dim_parlamentar

  # Origem dos scores E (political_exposure), A (expense_anomaly) e N (network_influence):
  # Gold risk_scores (grão periodo × parlamentar, já em [0,1]; média = identidade).
  scores_source:
    table: gold.risk_scores
    id_column: id_parlamentar
    period_expression: periodo
    aggregation: mean
    columns:
      E: political_exposure_score
      A: expense_anomaly_score
      N: network_influence_score

  output_dir: reports/risk_calibration
