# Parâmetros dos produtos analíticos/ML da Sprint 5 (fonte única ADR-008).
# Nenhum módulo deve ler este arquivo diretamente — sempre via
# pipeline.config.load_analytics_settings()/get_analytics() (ADR-008).
analytics:
  rede:
    # Disjuntor de custo do grafo (ADR-030.3): número de arestas por período
    # acima do qual o recálculo total dispara alerta no DQ Report — SEM
    # bloquear a execução. Guarda o gate futuro para reavaliar incremental
    # via ADR de superseding (aumento → reabrir decisão, não ajuste cego).
    limite_arestas_recorte: 50000
  risk:
    # Pesos do `risk_index` (ADR-029): ponderação dos 5 scores do ADR-027,
    # `risk_index_p = Σ_i w_i · score_i(p)`. Baseline 0.2 uniforme vigente
    # (ADR-003/ADR-029) — pesos são fonte única deste YAML, validados pelo
    # Pydantic (exatamente as 5 chaves, todas > 0, soma 1). Só mudam por ADR
    # de amendment (pós-Sprint 6.5, com dado real), nunca por operação manual.
    pesos:
      supplier_concentration_score: 0.2
      political_exposure_score: 0.2
      supplier_dependency_score: 0.2
      expense_anomaly_score: 0.2
      network_influence_score: 0.2
  anomalias:
    # Isolation Forest de despesas — hiperparâmetros de TREINO (ADR-065).
    # O modelo NÃO é retreinado no passo de anomalias (inferência-only): é
    # treinado por comando explícito (python -m analytics.anomalies.model
    # train) sobre anos fechados, serializado (joblib) e versionado como
    # artefato anomaly-<MAJOR>.<MINOR>. Mudar qualquer valor daqui gera novo
    # MAJOR na família anomaly-* (ADR-065, item 3).
    random_state: 42        # parâmetro de TREINO — medido e registrado no manifesto (item 4)
    n_estimators: 100
    max_samples: 'auto'     # NUNCA null: o scikit-learn rejeita None no fit (ADR-065, Contexto d)
    contamination: 0.05     # hiperparâmetro de treino (ADR-002); threshold -0.1 segue em inferência