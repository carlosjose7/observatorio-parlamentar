[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "pipeline*", "analytics*", "dashboard*", "feature_store*"]
exclude = ["tests*", "*.tests", "*.tests.*"]

[project]
name = "observatorio-parlamentar"
version = "0.1.0"
description = "Plataforma de inteligência parlamentar brasileira"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi[standard]>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "duckdb>=1.0.0",
]
pipeline = [
    "apache-airflow[postgres]==2.9.3",
    # dbt-core e dbt-duckdb devem compartilhar a mesma major.minor: o
    # adaptador duckdb é versionado acompanhando o dbt-core, e versões
    # divergentes quebram em runtime (dbt-duckdb 1.11 requer dbt-core 1.9+,
    # `Capability.MicrobatchConcurrency` — E2E HML 21/08/2026).
    "dbt-core~=1.8.0",
    "dbt-duckdb~=1.8.0",
    "duckdb>=1.0.0",
    "minio>=7.2.0",
    "pandera>=0.18.0",
    "pyarrow>=15.0",
]
dashboard = [
    "streamlit>=1.35.0",
    "openpyxl>=3.1.0",
    "matplotlib>=3.8.0",
    "networkx>=3.2.0",
    "plotly>=5.22.0",
]
analytics = [
    "scikit-learn>=1.4.0",
    "networkx>=3.2.0",
]
dev-dashboard = [
    # dashboard + dev para testes de UI no container api-test.
    # O CI (ci.yml) já usa .[dashboard,dev] diretamente; este extra
    # existe para o stage dev do api/Dockerfile.
    "streamlit>=1.35.0",
    "openpyxl>=3.1.0",
    "matplotlib>=3.8.0",
    "networkx>=3.2.0",
    "plotly>=5.22.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["api", "pipeline", "analytics", "dashboard"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Conjunto atual (Sprint 9, Gate 3): erros de execução (E4/E7/E9/F) +
# import ordering (I) + newline ao fim do arquivo (W292) + migrações seguras
# e mecânicas de modernização (UP017/UP035/UP037). Deferidos para porta
# própria: E501 (line-too-long — exigiria reformatação massiva) e B904/B905
# (semânticas, revisão manual).
select = ["E4", "E7", "E9", "F", "I", "W292", "UP017", "UP035", "UP037"]
