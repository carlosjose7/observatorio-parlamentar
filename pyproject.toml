[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "pipeline*", "analytics*", "dashboard*", "feature_store*"]
exclude = ["tests*", "*.tests", "*.tests.*"]

[project]
name = "observatorio-parlamentar"
version = "0.1.0"
description = "Plataforma de inteligência parlamentar brasileira"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi[standard]>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "duckdb>=1.0.0",
]
pipeline = [
    "apache-airflow[postgres]==2.9.3",
    "dbt-core>=1.7.0",
    "dbt-duckdb>=1.7.0",
    "duckdb>=1.0.0",
    "minio>=7.2.0",
    "pandera>=0.18.0",
    "pyarrow>=15.0",
]
dashboard = [
    "streamlit>=1.35.0",
    "openpyxl>=3.1.0",
    "matplotlib>=3.8.0",
    "networkx>=3.2.0",
]
analytics = [
    "scikit-learn>=1.4.0",
    "networkx>=3.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["api", "pipeline", "analytics", "dashboard"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Conjunto inicial do Ruff: erros que podem afetar execução. Regras de
# formatação/import ordering entram em uma migração dedicada, após eliminar o
# passivo histórico sem gerar uma alteração massiva nesta sprint.
select = ["E4", "E7", "E9", "F"]
