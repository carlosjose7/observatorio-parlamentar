[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "observatorio-parlamentar"
version = "0.1.0"
description = "Plataforma de inteligência parlamentar brasileira"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["api", "pipeline", "analytics"]
